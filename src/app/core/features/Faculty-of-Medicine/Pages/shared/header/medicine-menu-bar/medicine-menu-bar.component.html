<nav class="medicine-menu-bar">
  <div class="menu-container">
    <!-- Mobile Menu Toggle Button -->
    <button class="menu-toggle-btn" type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="!isCollapsed"
      aria-label="Toggle navigation" [class.active]="!isCollapsed">
      <span class="menu-toggle-icon">
        <i class="fas" [class.fa-bars]="isCollapsed" [class.fa-times]="!isCollapsed"></i>
      </span>
    </button>

    <div class="menu-nav" [class.collapsed]="isCollapsed" [class.expanded]="!isCollapsed" [class.mobile]="isMobile">
      <ul class="menu-list">
        @for (item of navbarItems(); track item.id) {
        <li class="menu-item dropdown" [class.has-dropdown]="(item.children?.length ?? 0) > 0">
          <a [routerLink]="getRouterLink(item)" routerLinkActive="active-menu-item" class="menu-link"
            [class.dropdown-toggle]="(item.children?.length ?? 0) > 0" (click)="onTabClick(item, $event)"> {{ item.label
            }} </a>

          <ul class="dropdown-menu" *ngIf="item.children?.length" [class.show]="activeDropdown === item.id"> @for (child
            of item.children; track child.id) { <li class="dropdown-sub-item"
              [class.has-sub-dropdown]="(child.children?.length ?? 0) > 0"> <a
                [routerLink]="item.slug + '/' + child.slug" routerLinkActive="active-submenu-item" class="dropdown-item"
                [class.dropdown-toggle]="(child.children?.length ?? 0) > 0"
                (click)="onSubTabClick(child, item, $event)"> {{ child.label }} </a>
              <!-- المستوى الثالث (sub-sub menu) -->
              <ul class="dropdown-submenu" *ngIf="child.children?.length" [class.show]="activeSubDropdown === child.id">
                @for (subChild of child.children; track subChild.id) { <li> <a
                    [routerLink]="item.slug + '/' + child.slug + '/' + subChild.slug"
                    routerLinkActive="active-sub-submenu-item" class="dropdown-submenu-item"
                    (click)="onSubSubTabClick(subChild, child, item, $event)"> {{ subChild.label }} </a> </li> } </ul>
            </li> } </ul>
        </li>
        }
      </ul>


    </div>
  </div>

  <!-- Click outside overlay for mobile -->
  <div class="dropdown-overlay" *ngIf="!isCollapsed && isMobile" (click)="isCollapsed = true"></div>
</nav>
